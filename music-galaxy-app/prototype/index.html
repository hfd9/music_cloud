<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080b13"><title>音乐星际 · 在声音之间漫游</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <canvas id="galaxy" tabindex="0" aria-label="音乐星空，拖动移动，滚轮缩放，Shift 加拖动旋转。也可用方向键移动，加减号缩放。"></canvas>
  <header class="topbar">
    <a class="brand" href="/" aria-label="音乐星际首页"><span class="brand-icon">✳</span><span>音乐星际<small>MUSIC GALAXY</small></span></a>
    <div class="top-actions"><span class="demo-tag">交互原型 · 演示数据</span><button id="search-toggle" class="icon-button" aria-label="搜索或打开歌手列表">⌕</button><button id="settings-toggle" class="icon-button" aria-label="画质与动效设置">☷</button></div>
  </header>
  <section class="intro" id="intro"><div class="eyebrow">FOLLOW YOUR CURIOSITY</div><h1>下一首喜欢的歌，<br>藏在哪颗星里？</h1><p>拖动漫游，滚轮靠近。点亮一颗星，听见一个新世界。</p></section>
  <nav class="genre-nav" aria-label="风格星云"><span class="nav-caption">探索星域</span><div id="genre-buttons"></div></nav>
  <aside id="catalog-panel" class="panel catalog-panel" hidden aria-label="搜索与歌手列表">
    <div class="panel-heading"><h2>寻找一颗星</h2><button class="icon-button" id="search-close" aria-label="关闭搜索">×</button></div>
    <label class="field-label" for="search">歌手或歌曲</label><input id="search" type="search" placeholder="输入名字，或在列表里发现" autocomplete="off">
    <label class="field-label" for="region">关联国家／地区（虚构属性）</label><select id="region"><option value="">全部地区</option value="CN">中国</option><option value="JP">日本</option><option value="US">美国</option><option value="GB">英国</option><option value="FR">法国</option></select>
    <div class="results-meta"><span id="result-count"></span><button id="clear-filters" class="text-button">清除筛选</button></div><div id="results" class="results"></div>
  </aside>
  <aside id="detail-panel" class="panel detail-panel" hidden aria-label="歌手与歌曲详情"></aside>
  <aside id="settings-panel" class="panel settings-panel" hidden aria-label="画质设置"><div class="panel-heading"><h2>漫游设置</h2><button id="settings-close" class="icon-button" aria-label="关闭设置">×</button></div><label class="field-label" for="quality">画面细节</label><select id="quality"><option value="low">轻量</option><option value="medium" selected>标准</option><option value="high">精细</option></select><label class="check-label"><input id="reduced-motion" type="checkbox">减少动态效果</label><p class="muted">系统减少动态效果设置会自动生效。开启后关闭星点闪烁、光晕脉动和镜头过渡。</p><div id="stats" class="stats"></div></aside>
  <div id="tooltip" class="tooltip" hidden></div>
  <div class="scene-footer"><div class="location"><span class="live-dot"></span><span id="location">宇宙漫游</span><span class="separator">/</span><span id="visible-count">200 位虚构歌手</span></div><div class="view-controls"><button id="home" aria-label="返回宇宙总览">⌂</button><button id="zoom-out" aria-label="缩小">−</button><button id="zoom-in" aria-label="放大">＋</button></div></div>
  <div class="gesture-hint">拖动移动 <span>·</span> 滚轮缩放 <span>·</span> Shift + 拖动旋转 <span>·</span> 靠近展开歌曲</div>
  <footer class="player-bar"><div class="album-art" id="album-art">♫</div><div class="now-playing"><strong id="player-title">让好奇心带路</strong><span id="player-subtitle">点一颗歌手星，靠近后发现歌曲</span></div><button id="play-toggle" class="play-button" disabled aria-label="播放">▶</button><div class="timeline"><span id="elapsed">0:00</span><progress id="progress" value="0" max="45" aria-label="播放进度"></progress><span>0:45</span></div><label class="volume-label">音量<input id="volume" type="range" min="0" max="1" step=".01" value=".3" aria-label="音量"></label><span class="audio-note">合成演示音频</span></footer>
  <div id="notice" role="status" aria-live="polite" class="notice" hidden></div>
  <script type="module" src="/src/app.js"></script>
</body>
</html>
